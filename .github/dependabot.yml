version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Tijuana
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - android
    # Coroutines 1.10+ requires a newer Kotlin metadata level than the current
    # Kotlin 2.0/KSP toolchain. Upgrade those components together instead of
    # allowing an isolated dependency PR that cannot compile.
    ignore:
      - dependency-name: org.jetbrains.kotlinx:kotlinx-coroutines-android
        versions:
          - "[1.10,)"
      - dependency-name: org.jetbrains.kotlinx:kotlinx-coroutines-test
        versions:
          - "[1.10,)"
    groups:
      android-build-tooling:
        patterns:
          - "com.android.*"
          - "org.jetbrains.kotlin.*"
          - "com.google.devtools.ksp"
          - "com.google.dagger.*"
      androidx:
        patterns:
          - "androidx.*"
      security-and-network:
        patterns:
          - "org.bouncycastle:*"
          - "com.github.mwiede:jsch"
          - "com.google.code.gson:gson"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Tijuana
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
