name: Apply product hardening

on:
  push:
    branches:
      - agent/modernize-permissions-updates-ui
    paths:
      - scripts/apply_product_hardening.py
      - .github/workflows/apply-product-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-product-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/modernize-permissions-updates-ui
          fetch-depth: 0

      - name: Apply deterministic patches
        run: python3 scripts/apply_product_hardening.py

      - name: Commit runtime integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ghostnexora/vpn/tunnel/SshTunnelEngine.kt \
                  app/src/main/java/com/ghostnexora/vpn/service/GhostVpnService.kt \
                  app/src/main/java/com/ghostnexora/vpn/ui/MainActivity.kt \
                  app/src/main/java/com/ghostnexora/vpn/util/JsonManager.kt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Integrate split routing, payload engine, and Xray import"
            git push origin HEAD:agent/modernize-permissions-updates-ui
          fi
