name: Build Android

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  XRAY_LIB_TAG: v26.5.19
  ANDROID_NDK_VERSION: 27.0.12077973
  CMAKE_VERSION: 3.22.1

jobs:
  build:
    name: Compilar, probar y validar protección
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Instalar NDK y CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;${ANDROID_NDK_VERSION}" "cmake;${CMAKE_VERSION}"

      - name: Descargar AndroidLibXrayLite
        uses: robinraju/release-downloader@v1.13
        with:
          repository: 2dust/AndroidLibXrayLite
          tag: ${{ env.XRAY_LIB_TAG }}
          fileName: libv2ray.aar
          out-file-path: app/libs/

      - name: Verificar dependencias nativas
        run: |
          test -s app/libs/libv2ray.aar
          test -s app/src/main/cpp/CMakeLists.txt
          test -s app/src/main/cpp/native_guard.cpp
          ls -lh app/libs/libv2ray.aar

      - name: Preparar Gradle
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x ./gradlew

      - name: Ejecutar pruebas unitarias
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Compilar APK Debug con JNI
        run: ./gradlew assembleDebug --stacktrace

      - name: Validar R8 y shrinking de Release
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: ./gradlew assembleRelease --stacktrace

      - name: Subir APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: GhostNexoraVPN-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Subir Release de validación R8
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: GhostNexoraVPN-r8-validation-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Restaurar keystore Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/ghostnexora-release.jks
          test -s app/ghostnexora-release.jks

      - name: Verificar keystore Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          keytool -list \
            -keystore app/ghostnexora-release.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.KEY_ALIAS }}" >/dev/null

      - name: Compilar APK Release firmado
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/app/ghostnexora-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew clean assembleRelease --stacktrace

      - name: Obtener APK Release y hash
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: apk_hash
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No se encontró el APK release"
            exit 1
          fi
          SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Verificar si cambió el APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: should_publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_SHA256: ${{ steps.apk_hash.outputs.sha256 }}
        run: |
          LATEST_BODY="$(gh release view --repo "${{ github.repository }}" --json body --jq '.body' 2>/dev/null || true)"
          if echo "$LATEST_BODY" | grep -q "APK_SHA256: $APK_SHA256"; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Crear Release y subir APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.should_publish.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="release-${{ github.run_number }}"
          APK="${{ steps.apk_hash.outputs.apk_path }}"
          NOTES="Construcción automática desde el commit \`${{ github.sha }}\`"$'\n'"Xray Core: ${{ env.XRAY_LIB_TAG }}"$'\n'"APK_SHA256: ${{ steps.apk_hash.outputs.sha256 }}"
          gh release create "$TAG" "$APK" \
            --repo "${{ github.repository }}" \
            --title "Ghost Nexora VPN $TAG" \
            --notes "$NOTES"
