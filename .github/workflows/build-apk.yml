name: Apply repository modernization

on:
  workflow_dispatch:
  push:
    branches:
      - agent/modernize-permissions-updates-ui

permissions:
  contents: write

concurrency:
  group: apply-modernization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decode and apply source changes
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/modernize_repo.py.gz.b64.part* | base64 --decode | gzip --decompress > /tmp/modernize_repo.py
          python3 -m py_compile /tmp/modernize_repo.py
          python3 /tmp/modernize_repo.py

      - name: Commit modernized production source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes produced"; exit 1; }
          git commit -m "[modernized] Remove deprecations and improve permissions, updater, and UI"
          git push
