name: Apply VPN MTU integration

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - agent/modernize-permissions-updates-ui

permissions:
  contents: write

concurrency:
  group: vpn-mtu-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v6
        with:
          ref: agent/modernize-permissions-updates-ui
          fetch-depth: 0

      - name: Align Android and Xray MTU
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/ghostnexora/vpn/service/GhostVpnService.kt')
          text = path.read_text(encoding='utf-8')

          stable_import = 'import com.ghostnexora.vpn.tunnel.StableXrayConfigFactory\n'
          anchor = 'import com.ghostnexora.vpn.tunnel.TunnelManager\n'
          if stable_import not in text:
              if anchor not in text:
                  raise SystemExit('TunnelManager import not found')
              text = text.replace(anchor, stable_import + anchor, 1)

          if '.setMtu(1500)' in text:
              text = text.replace(
                  '.setMtu(1500)',
                  '.setMtu(StableXrayConfigFactory.TUN_MTU)',
                  1,
              )
          elif '.setMtu(StableXrayConfigFactory.TUN_MTU)' not in text:
              raise SystemExit('VPN MTU call not found')

          old_log = '"TUN activo · IPv4/IPv6 · rutas completas"'
          new_log = '"TUN activo · MTU ${StableXrayConfigFactory.TUN_MTU} · IPv4/IPv6 · rutas completas"'
          if old_log in text:
              text = text.replace(old_log, new_log, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- app/src/main/java/com/ghostnexora/vpn/service/GhostVpnService.kt

      - name: Commit MTU integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ghostnexora/vpn/service/GhostVpnService.kt
          git diff --cached --quiet && { echo "No source changes produced"; exit 1; }
          git commit -m "Align Android and Xray TUN MTU"
          git push origin HEAD:agent/modernize-permissions-updates-ui
