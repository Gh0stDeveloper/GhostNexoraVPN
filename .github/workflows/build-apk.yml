name: Apply VPN runtime integration

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - agent/modernize-permissions-updates-ui

permissions:
  contents: write

concurrency:
  group: vpn-runtime-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v6
        with:
          ref: agent/modernize-permissions-updates-ui
          fetch-depth: 0

      - name: Patch Android VPN service
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/ghostnexora/vpn/service/GhostVpnService.kt')
          text = path.read_text(encoding='utf-8')

          import_old = 'import com.ghostnexora.vpn.tunnel.TunnelManager\nimport com.ghostnexora.vpn.tunnel.TunnelRuntime\n'
          import_new = 'import com.ghostnexora.vpn.tunnel.StableXrayConfigFactory\nimport com.ghostnexora.vpn.tunnel.TunnelManager\nimport com.ghostnexora.vpn.tunnel.TunnelRuntime\n'
          if import_old not in text and 'import com.ghostnexora.vpn.tunnel.StableXrayConfigFactory\n' not in text:
              raise SystemExit('Tunnel imports not found')
          text = text.replace(import_old, import_new, 1)

          callback_old = '''    private val tunnelManager by lazy {
              TunnelManager(applicationContext) { status ->
                  serviceScope.launch { logSafe(LogLevel.DEBUG, status, activeProfile?.id, tag = "CORE") }
              }
          }
          '''
          callback_new = '''    private val tunnelManager by lazy {
              TunnelManager(applicationContext) { status ->
                  val stage = Regex("^\\\\[([A-Z0-9_-]+)]").find(status)
                      ?.groupValues
                      ?.getOrNull(1)
                      ?: "CORE"
                  val message = status.replace(Regex("^\\\\[[A-Z0-9_-]+]\\\\s*"), "")
                  val level = when {
                      stage == "ERROR" || message.contains("ERROR", ignoreCase = true) -> LogLevel.ERROR
                      message.contains("WARN", ignoreCase = true) || message.contains("fall", ignoreCase = true) -> LogLevel.WARNING
                      message.contains("listo", ignoreCase = true) ||
                          message.contains("verific", ignoreCase = true) ||
                          message.contains("activo", ignoreCase = true) ||
                          message.contains("complet", ignoreCase = true) -> LogLevel.SUCCESS
                      else -> LogLevel.INFO
                  }
                  serviceScope.launch { logSafe(level, message, activeProfile?.id, tag = stage) }
              }
          }
          '''
          if callback_old not in text:
              raise SystemExit('Tunnel callback block not found')
          text = text.replace(callback_old, callback_new, 1)

          if '.setMtu(1500)' not in text:
              raise SystemExit('Android MTU literal not found')
          text = text.replace('.setMtu(1500)', '.setMtu(StableXrayConfigFactory.TUN_MTU)', 1)
          text = text.replace(
              '"TUN activo · IPv4/IPv6 · rutas completas"',
              '"TUN activo · MTU ${StableXrayConfigFactory.TUN_MTU} · IPv4/IPv6 · rutas completas"',
              1,
          )

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Commit service integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ghostnexora/vpn/service/GhostVpnService.kt
          git diff --cached --quiet && { echo "No source changes produced"; exit 1; }
          git commit -m "Align Android TUN MTU and classify connection stages"
          git push origin HEAD:agent/modernize-permissions-updates-ui
