name: Apply Phase 1 runtime

on:
  workflow_dispatch:
  push:
    branches:
      - agent/modernize-permissions-updates-ui

permissions:
  contents: write

concurrency:
  group: phase1-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v6
        with:
          ref: agent/modernize-permissions-updates-ui
          fetch-depth: 0

      - name: Apply Phase 1 source integration
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/apply_phase1_runtime.py
          python3 scripts/apply_phase1_runtime.py
          git status --short

      - name: Commit production changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- .github/workflows/build-apk.yml
          git add app scripts
          git diff --cached --check
          git commit -m "Implement Phase 1 diagnostics and network controls"
          git push origin HEAD:agent/modernize-permissions-updates-ui
