name: Build Android

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  XRAY_LIB_TAG: v26.5.19
  ANDROID_NDK_VERSION: 27.0.12077973
  CMAKE_VERSION: 3.22.1
  ANDROID_BUILD_TOOLS_VERSION: 35.0.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build, test and validate product hardening
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

      - name: Resolve Android build tools
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER_PATH="$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS_VERSION/apksigner"
          test -x "$APKSIGNER_PATH"
          "$APKSIGNER_PATH" version
          echo "APKSIGNER=$APKSIGNER_PATH" >> "$GITHUB_ENV"

      - name: Download AndroidLibXrayLite
        uses: robinraju/release-downloader@v1.13
        with:
          repository: 2dust/AndroidLibXrayLite
          tag: ${{ env.XRAY_LIB_TAG }}
          fileName: libv2ray.aar
          out-file-path: app/libs/

      - name: Verify native dependencies
        run: |
          test -s app/libs/libv2ray.aar
          test -s app/src/main/cpp/CMakeLists.txt
          test -s app/src/main/cpp/native_guard.cpp
          unzip -l app/libs/libv2ray.aar | grep -Fq 'assets/geoip.dat'
          unzip -l app/libs/libv2ray.aar | grep -Fq 'assets/geosite.dat'

      - name: Prepare Gradle
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x ./gradlew

      - name: Verify Android manifest policy
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          manifest = Path("app/src/main/AndroidManifest.xml")
          root = ET.parse(manifest).getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          permissions = {node.get(android + "name") for node in root.findall("uses-permission")}
          forbidden = {
              "android.permission.BIND_VPN_SERVICE",
              "android.permission.WRITE_EXTERNAL_STORAGE",
              "android.permission.QUERY_ALL_PACKAGES",
          }
          found = permissions & forbidden
          if found:
              raise SystemExit(f"Forbidden manifest permissions: {sorted(found)}")

          application = root.find("application")
          if application is None:
              raise SystemExit("Missing application node")
          services = application.findall("service")
          vpn = next((service for service in services if service.get(android + "name") == ".service.GhostVpnService"), None)
          if vpn is None:
              raise SystemExit("Missing GhostVpnService")
          if vpn.get(android + "permission") != "android.permission.BIND_VPN_SERVICE":
              raise SystemExit("GhostVpnService is not protected by BIND_VPN_SERVICE")
          if vpn.get(android + "exported") != "false":
              raise SystemExit("GhostVpnService must not be exported")
          if vpn.get(android + "process") != ":vpn":
              raise SystemExit("GhostVpnService must run in the private :vpn process")
          floating = next((service for service in services if service.get(android + "name") == ".service.FloatingWindowService"), None)
          if floating is None or floating.get(android + "process") != ":vpn":
              raise SystemExit("FloatingWindowService must share the private :vpn process")
          print("Manifest policy verified")
          PY

      - name: Verify isolated Java VPN runtime policy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_root = Path("app/src/main/java/com/ghostnexora/vpn")
          dashboard = (source_root / "ui/screens/dashboard/DashboardViewModel.kt").read_text()
          datastore = (source_root / "data/local/DataStoreManager.kt").read_text()
          database = (source_root / "data/local/AppDatabase.kt").read_text()
          service_path = source_root / "service/GhostVpnService.java"
          legacy_service = source_root / "service/GhostVpnService.kt"

          required_java_runtime = (
              "service/GhostVpnService.java",
              "service/VpnNotificationHelper.java",
              "tunnel/AndroidSecureRandomProvider.java",
              "tunnel/JschRuntime.java",
              "tunnel/NativeRuntimeArchitecture.java",
              "tunnel/OutboundSocketProtection.java",
              "tunnel/PhysicalNetworkSocketConnector.java",
              "tunnel/Socks5OutboundProbe.java",
              "tunnel/SshTunnelEngine.java",
              "tunnel/TlsTransport.java",
              "tunnel/TunnelManager.java",
              "tunnel/XrayCoreEngine.java",
              "tunnel/strategy/TunnelStrategy.java",
              "tunnel/strategy/SshTunnelStrategy.java",
          )

          missing = [str(source_root / relative) for relative in required_java_runtime if not (source_root / relative).is_file()]
          if missing:
              raise SystemExit(f"Missing Java VPN runtime files: {missing}")

          kotlin_twins = []
          for relative in required_java_runtime:
              java_file = source_root / relative
              kotlin_file = java_file.with_suffix(".kt")
              if kotlin_file.exists():
                  kotlin_twins.append(str(kotlin_file))
          if legacy_service.exists() and str(legacy_service) not in kotlin_twins:
              kotlin_twins.append(str(legacy_service))
          if kotlin_twins:
              raise SystemExit(f"Critical VPN runtime must not have Kotlin implementations: {kotlin_twins}")

          service = service_path.read_text()
          if "TunnelManager" in dashboard or "verifyOutbound" in dashboard:
              raise SystemExit("The UI process must not initialize the native VPN core")
          if "createMultiProcessCoordinator" not in datastore:
              raise SystemExit("Runtime preferences are not coordinated across processes")
          if "enableMultiInstanceInvalidation" not in database:
              raise SystemExit("Room logs will not refresh across the VPN process boundary")
          if "extends VpnService" not in service:
              raise SystemExit("GhostVpnService.java must extend Android VpnService")
          if "super.onBind(intent)" not in service:
              raise SystemExit("GhostVpnService must preserve Android's platform VPN binder")
          if "OutboundSocketProtection.install(this::protect)" not in service:
              raise SystemExit("GhostVpnService must install VpnService.protect(Socket) for outbound transports")
          print("Java VPN runtime isolation policy verified")
          PY

      - name: Scan tracked source for high-confidence secrets
        shell: bash
        run: |
          set -euo pipefail
          PATTERN='(ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|AIza[0-9A-Za-z_-]{30,}|sk-[A-Za-z0-9]{32,})'
          if git grep -nE "$PATTERN" -- 'app/**' '.github/**' 'gradle*' ':!app/src/test/**'; then
            echo "High-confidence secret pattern found in tracked source"
            exit 1
          fi
          echo "No high-confidence token patterns found"

      - name: Verify profile database migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          database = Path("app/src/main/java/com/ghostnexora/vpn/data/local/AppDatabase.kt").read_text()
          profile = Path("app/src/main/java/com/ghostnexora/vpn/data/model/VpnProfile.kt").read_text()
          required_database = (
              "version = 4",
              "Migration(2, 3)",
              "Migration(3, 4)",
              "ADD COLUMN tls_verification_mode TEXT NOT NULL DEFAULT 'strict'",
              "ADD COLUMN note_html TEXT NOT NULL DEFAULT ''",
              "ADD COLUMN is_locked INTEGER NOT NULL DEFAULT 0",
              "ADD COLUMN sealed_config TEXT NOT NULL DEFAULT ''",
              "ADD COLUMN locked_package_id TEXT NOT NULL DEFAULT ''",
              "ADD COLUMN protection_version INTEGER NOT NULL DEFAULT 0",
              ".addMigrations(MIGRATION_2_3, MIGRATION_3_4)",
          )
          required_profile = (
              'name = "tls_verification_mode"',
              'defaultValue = "\'strict\'"',
              'name = "note_html"',
              'name = "is_locked"',
              'name = "sealed_config"',
              'name = "locked_package_id"',
              'name = "protection_version"',
          )
          missing = [
              token
              for token in required_database
              if token not in database
          ] + [
              token
              for token in required_profile
              if token not in profile
          ]
          if missing:
              raise SystemExit(f"Profile migration chain is incomplete: {missing}")
          print("Profile migrations 2 -> 3 -> 4 verified")
          PY

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace --warning-mode all 2>&1 | tee gradle-test.log

      - name: Generate dependency inventory
        shell: bash
        run: |
          ./gradlew app:dependencies --configuration debugRuntimeClasspath > dependency-inventory.txt
          test -s dependency-inventory.txt

      - name: Run Android Lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew lintDebug --stacktrace --warning-mode all 2>&1 | tee gradle-lint.log

      - name: Build Debug APK with JNI
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --warning-mode all 2>&1 | tee gradle-debug.log

      - name: Verify native ABIs in Debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -s "$APK"
          unzip -l "$APK" > debug-apk-contents.txt
          for abi in arm64-v8a armeabi-v7a x86_64; do
            grep -Fq "lib/$abi/libghostguard.so" debug-apk-contents.txt || {
              echo "Missing libghostguard.so for $abi"
              exit 1
            }
            grep -Eq "lib/$abi/[^/]+\\.so" debug-apk-contents.txt || {
              echo "No native libraries found for $abi"
              exit 1
            }
          done
          echo "Required native ABIs verified"

      - name: Validate Release R8 and resource shrinking
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --warning-mode all 2>&1 | tee gradle-release.log

      - name: Reject source deprecation warnings
        shell: bash
        run: |
          set -euo pipefail
          WARNINGS="$(grep -hE 'w: file://.*(is deprecated|needs opt-in)|WARNING: We recommend using a newer Android Gradle plugin' gradle-*.log || true)"
          if [ -n "$WARNINGS" ]; then
            printf '%s\n' "$WARNINGS"
            exit 1
          fi
          echo "No tracked Kotlin/Android deprecation warnings found."

      - name: Verify hardened runtime after R8
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -s "$APK"
          DEX_DIR="$(mktemp -d)"
          trap 'rm -rf "$DEX_DIR"' EXIT
          unzip -qq "$APK" 'classes*.dex' -d "$DEX_DIR"
          for descriptor in \
            'Lcom/jcraft/jsch/DHEC256;' \
            'Lcom/jcraft/jsch/DHEC384;' \
            'Lcom/jcraft/jsch/DHEC521;' \
            'Lcom/jcraft/jsch/DHGEX256;' \
            'Lcom/jcraft/jsch/UserAuthPassword;' \
            'Lcom/jcraft/jsch/UserAuthKeyboardInteractive;' \
            'Lcom/jcraft/jsch/jce/Random;' \
            'Lcom/jcraft/jsch/jce/SHA256;' \
            'Lcom/jcraft/jsch/jce/AES256CTR;' \
            'Lcom/jcraft/jsch/jce/AES256GCM;' \
            'Lcom/jcraft/jsch/jce/HMACSHA512;' \
            'Lcom/jcraft/jsch/AndroidRandomBridge;' \
            'Lcom/ghostnexora/vpn/tunnel/AndroidSecureRandomProvider;' \
            'Lcom/ghostnexora/vpn/tunnel/TlsTransport;' \
            'Lcom/ghostnexora/vpn/data/model/TlsVerificationMode;' \
            'Lcom/ghostnexora/vpn/diagnostics/ConnectionDiagnosticsEngine;' \
            'Lcom/ghostnexora/vpn/tunnel/ConnectionErrorCatalog;' \
            'Lcom/ghostnexora/vpn/data/model/AppRoutingPreferences;' \
            'Lcom/ghostnexora/vpn/util/PayloadEngine;' \
            'Lcom/ghostnexora/vpn/util/ProtocolLinkParser;'
          do
            grep -aR -Fq "$descriptor" "$DEX_DIR" || { echo "Missing runtime class: $descriptor"; exit 1; }
          done
          MAPPING="$(find app/build/outputs/mapping/release -type f -name 'mapping.txt' -print -quit)"
          test -s "$MAPPING"
          for source_class in \
            'com.ghostnexora.vpn.security.Gnx3ConfigCodec' \
            'com.ghostnexora.vpn.security.LockedProfileVault' \
            'com.ghostnexora.vpn.security.HtmlNoteSanitizer' \
            'com.ghostnexora.vpn.security.AppManagedConfigKeyProvider'
          do
            mapping_line="$(grep -F "${source_class} -> " "$MAPPING" | head -n 1)"
            test -n "$mapping_line" || {
              echo "Missing hardened GNX3 runtime class from R8 mapping: $source_class"
              exit 1
            }
            mapped_class="${mapping_line#* -> }"
            mapped_class="${mapped_class%:}"
            if [ "$mapped_class" = "$source_class" ]; then
              echo "GNX3 runtime class was not obfuscated: $source_class"
              exit 1
            fi
          done
          if grep -Eq '^[[:space:]]+java\.util\.List drawerItems ->' "$MAPPING"; then
            echo "Screen.drawerItems must not have a static backing list; it can capture null during class initialization."
            exit 1
          fi
          echo "Hardened runtime classes survived R8."

      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: GhostNexoraVPN-gradle-diagnostics-${{ github.run_number }}
          path: |
            gradle-test.log
            gradle-lint.log
            gradle-debug.log
            gradle-release.log
            dependency-inventory.txt
            debug-apk-contents.txt
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.*
            app/build/outputs/mapping/**
          if-no-files-found: warn

      - name: Upload Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: GhostNexoraVPN-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload R8 validation Release
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: GhostNexoraVPN-r8-validation-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Restore Release keystore
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/ghostnexora-release.jks
          test -s app/ghostnexora-release.jks

      - name: Verify Release keystore
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          keytool -list -keystore app/ghostnexora-release.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -alias "${{ secrets.KEY_ALIAS }}" >/dev/null

      - name: Build signed Release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/app/ghostnexora-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew clean assembleRelease --stacktrace --warning-mode all

      - name: Prepare Release metadata and checksum
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          test -s "$APK_PATH"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          mkdir -p app/build/publish
          PUBLISH_APK="app/build/publish/GhostNexoraVPN-${VERSION_NAME}.apk"
          cp "$APK_PATH" "$PUBLISH_APK"
          SHA256="$(sha256sum "$PUBLISH_APK" | awk '{print $1}')"
          APKSIGNER_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$PUBLISH_APK" 2>&1)" || {
            printf '%s\n' "$APKSIGNER_OUTPUT"
            exit 1
          }
          printf '%s\n' "$APKSIGNER_OUTPUT"
          SIGNER_SHA256=""
          shopt -s nocasematch
          while IFS= read -r line; do
            if [[ "$line" =~ certificate[[:space:]]SHA-256[[:space:]]digest:[[:space:]]*([[:xdigit:]]{64}) ]]; then
              SIGNER_SHA256="${BASH_REMATCH[1]}"
              break
            fi
          done <<< "$APKSIGNER_OUTPUT"
          shopt -u nocasematch
          if [[ ! "$SIGNER_SHA256" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "Unable to parse signer SHA-256 digest from apksigner output"
            exit 1
          fi
          printf '%s  %s\n' "$SHA256" "$(basename "$PUBLISH_APK")" > "${PUBLISH_APK}.sha256"
          echo "apk_path=$PUBLISH_APK" >> "$GITHUB_OUTPUT"
          echo "sha256_path=${PUBLISH_APK}.sha256" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "signer_sha256=$SIGNER_SHA256" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Decide whether to publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: should_publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_SHA256: ${{ steps.release_meta.outputs.sha256 }}
        run: |
          LATEST_BODY="$(gh release view --repo "${{ github.repository }}" --json body --jq '.body' 2>/dev/null || true)"
          if echo "$LATEST_BODY" | grep -q "APK_SHA256: $APK_SHA256"; then echo "publish=false" >> "$GITHUB_OUTPUT"; else echo "publish=true" >> "$GITHUB_OUTPUT"; fi

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.should_publish.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="v${{ steps.release_meta.outputs.version_name }}-build${{ github.run_number }}"
          NOTES="Ghost Nexora VPN production build"$'\n\n'\
          "versionName: ${{ steps.release_meta.outputs.version_name }}"$'\n'\
          "versionCode: ${{ steps.release_meta.outputs.version_code }}"$'\n'\
          "Xray Core: ${{ env.XRAY_LIB_TAG }}"$'\n'\
          "Commit: ${{ github.sha }}"$'\n'\
          "APK_SHA256: ${{ steps.release_meta.outputs.sha256 }}"$'\n'\
          "SIGNER_SHA256: ${{ steps.release_meta.outputs.signer_sha256 }}"
          gh release create "$TAG" \
            "${{ steps.release_meta.outputs.apk_path }}" \
            "${{ steps.release_meta.outputs.sha256_path }}" \
            --repo "${{ github.repository }}" \
            --title "Ghost Nexora VPN ${{ steps.release_meta.outputs.version_name }}" \
            --notes "$NOTES" \
            --latest
