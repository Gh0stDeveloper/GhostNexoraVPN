name: Build Android

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  XRAY_LIB_TAG: v26.5.19
  ANDROID_NDK_VERSION: 27.0.12077973
  CMAKE_VERSION: 3.22.1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build, test and validate protection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "ndk;${ANDROID_NDK_VERSION}" "cmake;${CMAKE_VERSION}"

      - name: Download AndroidLibXrayLite
        uses: robinraju/release-downloader@v1.13
        with:
          repository: 2dust/AndroidLibXrayLite
          tag: ${{ env.XRAY_LIB_TAG }}
          fileName: libv2ray.aar
          out-file-path: app/libs/

      - name: Verify native dependencies
        run: |
          test -s app/libs/libv2ray.aar
          test -s app/src/main/cpp/CMakeLists.txt
          test -s app/src/main/cpp/native_guard.cpp
          ls -lh app/libs/libv2ray.aar

      - name: Prepare Gradle
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x ./gradlew

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace --warning-mode all 2>&1 | tee gradle-test.log

      - name: Build Debug APK with JNI
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --warning-mode all 2>&1 | tee gradle-debug.log

      - name: Validate Release R8 and resource shrinking
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --warning-mode all 2>&1 | tee gradle-release.log

      - name: Reject source deprecation warnings
        shell: bash
        run: |
          set -euo pipefail
          WARNINGS="$(grep -hE 'w: file://.*(is deprecated|needs opt-in)|WARNING: We recommend using a newer Android Gradle plugin' gradle-*.log || true)"
          if [ -n "$WARNINGS" ]; then
            printf '%s\n' "$WARNINGS"
            echo "Source or Android toolchain deprecation warnings remain."
            exit 1
          fi
          echo "No tracked Kotlin/Android deprecation warnings found."

      - name: Verify JSch providers after R8
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -s "$APK"
          DEX_DIR="$(mktemp -d)"
          trap 'rm -rf "$DEX_DIR"' EXIT
          unzip -qq "$APK" 'classes*.dex' -d "$DEX_DIR"

          for descriptor in \
            'Lcom/jcraft/jsch/jce/Random;' \
            'Lcom/jcraft/jsch/jce/SHA256;' \
            'Lcom/jcraft/jsch/jce/AES256GCM;' \
            'Lcom/jcraft/jsch/jgss/GSSContextKrb5;'
          do
            if ! grep -aR -Fq "$descriptor" "$DEX_DIR"; then
              echo "R8 removed a JSch class loaded through reflection: $descriptor"
              exit 1
            fi
          done

          echo "JSch cryptographic providers are present in the Release APK."

      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: GhostNexoraVPN-gradle-diagnostics-${{ github.run_number }}
          path: |
            gradle-test.log
            gradle-debug.log
            gradle-release.log
            app/build/reports/tests/**
            app/build/outputs/mapping/**
          if-no-files-found: warn

      - name: Upload Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: GhostNexoraVPN-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload R8 validation Release
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: GhostNexoraVPN-r8-validation-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Restore Release keystore
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/ghostnexora-release.jks
          test -s app/ghostnexora-release.jks

      - name: Verify Release keystore
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          keytool -list \
            -keystore app/ghostnexora-release.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.KEY_ALIAS }}" >/dev/null

      - name: Build signed Release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/app/ghostnexora-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew clean assembleRelease --stacktrace --warning-mode all

      - name: Prepare Release metadata and checksum
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -s "$APK_PATH"
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          mkdir -p app/build/publish
          PUBLISH_APK="app/build/publish/GhostNexoraVPN-${VERSION_NAME}.apk"
          cp "$APK_PATH" "$PUBLISH_APK"
          SHA256="$(sha256sum "$PUBLISH_APK" | awk '{print $1}')"
          printf '%s  %s\n' "$SHA256" "$(basename "$PUBLISH_APK")" > "${PUBLISH_APK}.sha256"
          echo "apk_path=$PUBLISH_APK" >> "$GITHUB_OUTPUT"
          echo "sha256_path=${PUBLISH_APK}.sha256" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Decide whether to publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: should_publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_SHA256: ${{ steps.release_meta.outputs.sha256 }}
        run: |
          LATEST_BODY="$(gh release view --repo "${{ github.repository }}" --json body --jq '.body' 2>/dev/null || true)"
          if echo "$LATEST_BODY" | grep -q "APK_SHA256: $APK_SHA256"; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.should_publish.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="v${{ steps.release_meta.outputs.version_name }}-build${{ github.run_number }}"
          NOTES="Ghost Nexora VPN production build"$'\n\n'\
          "versionName: ${{ steps.release_meta.outputs.version_name }}"$'\n'\
          "versionCode: ${{ steps.release_meta.outputs.version_code }}"$'\n'\
          "Xray Core: ${{ env.XRAY_LIB_TAG }}"$'\n'\
          "Commit: ${{ github.sha }}"$'\n'\
          "APK_SHA256: ${{ steps.release_meta.outputs.sha256 }}"
          gh release create "$TAG" \
            "${{ steps.release_meta.outputs.apk_path }}" \
            "${{ steps.release_meta.outputs.sha256_path }}" \
            --repo "${{ github.repository }}" \
            --title "Ghost Nexora VPN ${{ steps.release_meta.outputs.version_name }}" \
            --notes "$NOTES" \
            --latest
