name: Construir APK Release

on:
  push:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build:
    name: Compilar APK Release
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Descargar código
        uses: actions/checkout@v4

      - name: ☕ Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🔐 Restaurar keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/ghostnexora-release.jks

      - name: 🧪 Verificar keystore
        run: |
          ls -lh app/ghostnexora-release.jks
          keytool -list -v \
            -keystore app/ghostnexora-release.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.KEY_ALIAS }}"

      - name: ⚙️ Crear local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: 🔧 Dar permisos a gradlew
        run: chmod +x ./gradlew

      - name: 🛠️ Compilar APK Release
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/app/ghostnexora-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: 📦 Obtener APK y calcular hash
        id: apk_hash
        run: |
          APK_PATH=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No se encontró el APK generado."
            exit 1
          fi
          SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: 🔎 Verificar si el APK cambió
        id: should_publish
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB }}
          APK_SHA256: ${{ steps.apk_hash.outputs.sha256 }}
        run: |
          TAG="release-${{ github.run_number }}"
          OWNER_REPO="GHICO-CP/GhostNexoraVPN"
          PUBLISH="true"
          if gh release view "$TAG" --repo "$OWNER_REPO" >/dev/null 2>&1; then
            echo "Ya existe el release $TAG. No se volverá a publicar."
            PUBLISH="false"
          else
            LATEST_BODY="$(gh release view --repo "$OWNER_REPO" --json body --jq '.body' 2>/dev/null || true)"
            if echo "$LATEST_BODY" | grep -q "APK_SHA256: $APK_SHA256"; then
              echo "El APK no cambió respecto al último release. No se publicará."
              PUBLISH="false"
            fi
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

      - name: 🚀 Crear Release y subir APK
        if: steps.should_publish.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        run: |
          TAG="release-${{ github.run_number }}"
          TITLE="Release ${{ github.run_number }}"
          APK="${{ steps.apk_hash.outputs.apk_path }}"
          NOTES="Construcción automática desde el commit \`${{ github.sha }}\`"$'\n'"Ejecución #${{ github.run_number }}"$'\n'"APK_SHA256: ${{ steps.apk_hash.outputs.sha256 }}"
          gh release create "$TAG" "$APK" \
            --repo "GHICO-CP/GhostNexoraVPN" \
            --title "$TITLE" \
            --notes "$NOTES"
